<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estimax — אין חיבור</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(135deg,#0C447C 0%,#0A3660 100%);color:#fff;
       font-family:'Segoe UI',Arial,sans-serif;text-align:center;padding:24px}
  .box{max-width:340px}
  .logo{font-size:32px;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
  .sub{font-size:13px;opacity:.75;margin-bottom:32px}
  h1{font-size:20px;margin:0 0 12px}
  p{font-size:14px;line-height:1.7;opacity:.85;margin:0 0 28px}
  button{background:#fff;color:#0C447C;border:0;border-radius:10px;padding:13px 32px;
         font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">Estimax</div>
    <div class="sub">הדרך החכמה להעריך</div>
    <h1>אין חיבור לאינטרנט</h1>
    <p>העבודה שכבר שמרת נשמרה במכשיר ותסונכרן אוטומטית ברגע שהחיבור יחזור.</p>
    <button onclick="location.href='./index.html'">נסה שוב</button>
  </div>
  <script>
    window.addEventListener('online', function(){ location.href = './index.html'; });
  </script>
</body>
</html>
